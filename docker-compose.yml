services:
  db:
    image: postgres:16
    container_name: scheduler_db
    restart: always
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: chessfighter
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d
      - ./backup:/backup

  backend:
    build: ./backend
    container_name: scheduler_backend
    restart: always
    depends_on:
      - db
      - minio
    environment:
      DATABASE_URL: postgresql://chessfighter:123456@db:5432/scheduler
      POSTGRES_USER: chessfighter
      POSTGRES_PASSWORD: 123456
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: scheduler
      PROFILE_IMAGE_BASE_URL: /storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: chessfighter
      MINIO_SECRET_KEY: chessfighter123
      MINIO_BUCKET: scheduler-assets
      MINIO_SECURE: "false"
      MINIO_DATA_PATH: /minio_data
    volumes:
      - ./backup:/backup
      - minio_data:/minio_data:ro

  frontend:
    build: ./frontend
    container_name: scheduler_frontend
    restart: always
    depends_on:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: scheduler_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chessfighter
      MINIO_ROOT_PASSWORD: chessfighter123
    volumes:
      - minio_data:/data
    ports:
      - "9101:9001"

  minio_init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: scheduler_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: chessfighter
      MINIO_ROOT_PASSWORD: chessfighter123
    volumes:
      - ./backend/upload/profile-imgs:/seed/profile-imgs:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb -p local/scheduler-assets || true;
      mc anonymous set public local/scheduler-assets;
      mc cp --recursive /seed/profile-imgs local/scheduler-assets/profile-imgs;
      "

  backup:
    image: alpine:latest
    container_name: scheduler_backup
    restart: always
    depends_on:
      - db
    environment:
      POSTGRES_USER: chessfighter
      POSTGRES_PASSWORD: 123456
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: scheduler
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backend/scripts/backup.sh:/backup.sh:ro
      - ./backup:/backup
      - minio_data:/minio_data:ro
    entrypoint: >
      sh -c "
      apk add --no-cache postgresql-client bash tzdata;
      echo 'Backup scheduler started. Daily backup time: 22:00 Asia/Ho_Chi_Minh';
      while true; do
        if [ \"$$(date +%H%M)\" = '2200' ]; then
          today=\"$$(date +%F)\";
          if [ \"$$(cat /tmp/last_backup 2>/dev/null)\" != \"$$today\" ]; then
            /backup.sh /backup && echo \"$$today\" > /tmp/last_backup;
          fi;
        fi;
        sleep 60;
      done
      "

  gateway:
    image: nginx:1.27-alpine
    container_name: scheduler_gateway
    restart: always
    depends_on:
      - frontend
      - backend
      - minio
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  postgres_data:
  minio_data:
